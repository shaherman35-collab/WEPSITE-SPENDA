const AdminEditor = ({ title, data, setData, fields, onBack, keyName = "id" }) => {
  const [edit, setEdit] = useState(null);
  const [draft, setDraft] = useState({});
  const startEdit = (it) => { setEdit(it); setDraft({ ...it }); };
  const startAdd = () => { setEdit(null); setDraft({ [keyName]: genId() }); };
  const cancel = () => { setEdit(null); setDraft({}); };
  const save = () => { if (!edit) setData([draft, ...data]); else setData(data.map(x => x[keyName] === draft[keyName] ? draft : x)); setEdit(null); setDraft({}); };
  const remove = (id) => { if (confirm("Hapus data ini?")) setData(data.filter(x => x[keyName] !== id)); };
  return (
    <div>
      <div className="mb-6 flex items-center justify-between"><div><div className="text-xs font-bold uppercase tracking-widest text-yellow-600">Admin Panel</div><h2 className="font-display text-2xl font-bold text-navy-950">{title}</h2></div>
        <button onClick={onBack} className="inline-flex items-center gap-1 rounded-full border-2 border-navy-900 px-4 py-2 text-sm font-bold text-navy-900 hover:bg-navy-900 hover:text-white"><I.ChevronLeft c="h-4 w-4" /> Kembali</button>
      </div>
      <div className="mb-4 flex justify-end"><button onClick={startAdd} className="inline-flex items-center gap-1 rounded-full bg-green-600 px-4 py-2 text-sm font-bold text-white hover:bg-green-500"><I.Plus c="h-4 w-4" /> Tambah Data</button></div>
      {(edit || Object.keys(draft).length > 1) && (
        <div className="mb-6 rounded-2xl border-2 border-dashed border-navy-200 bg-navy-50/50 p-6">
          <h3 className="font-display text-lg font-bold text-navy-950">{edit ? "Edit Data" : "Tambah Data Baru"}</h3>
          <div className="mt-4 grid gap-4 md:grid-cols-2">{fields.map(f => (
            <div key={f.key} className={f.type === "textarea" ? "md:col-span-2" : ""}>
              <label className="mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">{f.label}</label>
              {f.type === "textarea" ? <textarea rows={3} value={draft[f.key] || ""} onChange={e => setDraft({ ...draft, [f.key]: e.target.value })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-navy-500 focus:ring-2 focus:ring-navy-100" /> : <input value={draft[f.key] || ""} onChange={e => setDraft({ ...draft, [f.key]: e.target.value })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-navy-500 focus:ring-2 focus:ring-navy-100" />}
            </div>
          ))}</div>
          <div className="mt-4 flex gap-3">
            <button onClick={save} className="inline-flex items-center gap-1 rounded-full bg-navy-900 px-5 py-2.5 text-sm font-bold text-white hover:bg-navy-800"><I.Save c="h-4 w-4" /> {edit ? "Simpan" : "Tambah"}</button>
            <button onClick={cancel} className="rounded-full border border-slate-300 px-5 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-100">Batal</button>
          </div>
        </div>
      )}
      <div className="space-y-3">{data.map(it => (
        <div key={it[keyName]} className="flex items-start justify-between rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-100">
          <div className="flex-1"><h4 className="font-display text-base font-bold text-navy-950">{it.judul || it.tanggal || it.nama}</h4>
            <p className="mt-1 text-sm text-slate-600 line-clamp-2">{it.isi || it.deskripsi || it.lembaga || it.tipe || it.jabatan}</p>
            {it.tanggal && <div className="mt-1 text-xs text-slate-400">{it.tanggal}</div>}
          </div>
          <div className="ml-4 flex gap-2"><button onClick={() => startEdit(it)} className="rounded-full bg-blue-100 p-2 text-blue-700 hover:bg-blue-200"><I.Edit c="h-4 w-4" /></button>
            <button onClick={() => remove(it[keyName])} className="rounded-full bg-red-100 p-2 text-red-700 hover:bg-red-200"><I.Trash c="h-4 w-4" /></button></div>
        </div>
      ))}</div>
      {data.length === 0 && <div className="rounded-2xl bg-slate-50 p-10 text-center text-slate-500">Belum ada data. Klik "Tambah Data" untuk menambahkan.</div>}
    </div>
  );
};

            <textarea rows={3} value={p.kurikulum.intro || ""} onChange={e => update("kurikulum", { intro: e.target.value })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" />
            <label className="mt-3 mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">Items (satu per baris: JUDUL | DESKRIPSI)</label>
            <textarea rows={8} value={(p.kurikulum.items || []).map(x => `${x.judul} | ${x.deskripsi}`).join("\n")} onChange={e => update("kurikulum", { items: e.target.value.split("\n").map(l => { const [j, ...d] = l.split("|"); return { judul: (j || "").trim(), deskripsi: d.join("|").trim() }; }).filter(x => x.judul) })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" /></div>}
          {tab === "kalender" && <div><h3 className="font-display text-lg font-bold text-navy-950 mb-4">Edit Kalender</h3>
            <label className="mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">Tahun Ajaran</label>
            <input value={p.kalender.tahunAjaran || ""} onChange={e => update("kalender", { tahunAjaran: e.target.value })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" />
            <label className="mt-3 mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">Items (satu per baris: JUDUL | TANGGAL)</label>
            <textarea rows={8} value={(p.kalender.items || []).map(x => `${x.judul} | ${x.tanggal}`).join("\n")} onChange={e => update("kalender", { items: e.target.value.split("\n").map(l => { const [j, ...d] = l.split("|"); return { judul: (j || "").trim(), tanggal: d.join("|").trim() }; }).filter(x => x.judul) })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" /></div>}
          {tab === "jadwal" && <div><h3 className="font-display text-lg font-bold text-navy-950 mb-4">Edit Jadwal</h3>
            <label className="mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">Jam</label>
            <input value={p.jadwal.jam || ""} onChange={e => update("jadwal", { jam: e.target.value })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" />
            <label className="mt-3 mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">Hari (satu per baris)</label>
            <textarea rows={6} value={(p.jadwal.days || []).join("\n")} onChange={e => update("jadwal", { days: e.target.value.split("\n") })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" />
            <label className="mt-3 mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">Mata Pelajaran (satu per baris, urut sesuai hari)</label>
            <textarea rows={6} value={(p.jadwal.mapel || []).join("\n")} onChange={e => update("jadwal", { mapel: e.target.value.split("\n") })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" /></div>}
          {tab === "osis" && <div><h3 className="font-display text-lg font-bold text-navy-950 mb-4">Edit OSIS & MPK</h3>
            <h4 className="mt-2 mb-2 font-bold text-navy-950">OSIS</h4>
            <div className="space-y-2">{[{k:"deskripsi",l:"Deskripsi"},{k:"ketua",l:"Ketua"},{k:"wakil",l:"Wakil"},{k:"sekretaris",l:"Sekretaris"},{k:"bendahara",l:"Bendahara"}].map(f => (
              <div key={f.k}><label className="mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">{f.l}</label>
                <input value={p.osis.osis?.[f.k] || ""} onChange={e => update("osis", { osis: { ...p.osis.osis, [f.k]: e.target.value } })} className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm" /></div>
            ))}
            <h4 className="mt-4 mb-2 font-bold text-navy-950">MPK</h4>
            <div className="space-y-2">{[{k:"deskripsi",l:"Deskripsi"},{k:"ketua",l:"Ketua"},{k:"anggota",l:"Anggota"},{k:"pertemuan",l:"Pertemuan"},{k:"program",l:"Program"}].map(f => (
              <div key={f.k}><label className="mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">{f.l}</label>
                <input value={p.osis.mpk?.[f.k] || ""} onChange={e => update("osis", { mpk: { ...p.osis.mpk, [f.k]: e.target.value } })} className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm" /></div>
            ))}
          </div>}
          {tab === "tatib" && <AdminEditor title="Kelola Tata Tertib" data={p.tatib} setData={(v) => updArr("tatib", v)} fields={[{key:"judul",label:"Judul Kategori"},{key:"items",label:"Items (satu per baris)",type:"array"}]} onBack={onBack} />}
          {tab === "ppdb" && <div><h3 className="font-display text-lg font-bold text-navy-950 mb-4">Edit PPDB</h3>
            <div className="grid gap-3 md:grid-cols-3">
              {[{k:"gelombang",l:"Gelombang"},{k:"kuota",l:"Kuota"},{k:"rombel",l:"Rombel"}].map(f => (
                <div key={f.k}><label className="mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">{f.l}</label>
                  <input value={p.ppdb[f.k] || ""} onChange={e => update("ppdb", { [f.k]: e.target.value })} className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm" /></div>
              ))}
            </div>
            <label className="mt-3 mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">Alur (satu per baris: NO | JUDUL | DESKRIPSI)</label>
            <textarea rows={6} value={(p.ppdb.alur || []).map(x => `${x.no} | ${x.judul} | ${x.deskripsi}`).join("\n")} onChange={e => update("ppdb", { alur: e.target.value.split("\n").map(l => { const [n, j, ...d] = l.split("|"); return { no: +n, judul: (j || "").trim(), deskripsi: d.join("|").trim() }; }).filter(x => x.judul) })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" />
            <label className="mt-3 mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">Syarat (satu per baris)</label>
            <textarea rows={6} value={(p.ppdb.syarat || []).join("\n")} onChange={e => update("ppdb", { syarat: e.target.value.split("\n") })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" />
            <label className="mt-3 mb-1 block text-xs font-bold uppercase tracking-widest text-slate-600">Jalur (satu per baris)</label>
            <textarea rows={5} value={(p.ppdb.jalur || []).join("\n")} onChange={e => update("ppdb", { jalur: e.target.value.split("\n") })} className="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" /></div>}
        </div>
      </div>
    </div>
  );
};

/* ============ APP ============ */
function App() {
  const [page, setPage] = useState("beranda");
  const [adminIn, setAdminIn] = useState(false);
  const [p, setP] = useState({
    pengaturan: get(KEYS.pengaturan, D.pengaturan),
    sambutan: get(KEYS.sambutan, D.sambutan),
    sejarah: get(KEYS.sejarah, D.sejarah),
    visimisi: get(KEYS.visimisi, D.visimisi),
    struktur: get(KEYS.struktur, D.struktur),
    guru: get(KEYS.guru, D.guru),
    kurikulum: get(KEYS.kurikulum, D.kurikulum),
    kalender: get(KEYS.kalender, D.kalender),
    jadwal: get(KEYS.jadwal, D.jadwal),
    ekskul: get(KEYS.ekskul, D.ekskul),
    osis: get(KEYS.osis, D.osis),
    tatib: get(KEYS.tatib, D.tatib),
    fasilitas: get(KEYS.fasilitas, D.fasilitas),
    ppdb: get(KEYS.ppdb, D.ppdb),
    download: get(KEYS.download, D.download),
    keunggulan: get(KEYS.keunggulan, D.keunggulan),
    berita: get(KEYS.berita, D.berita),
    pengumuman: get(KEYS.pengumuman, D.pengumuman),
    prestasi: get(KEYS.prestasi, D.prestasi),
    galeri: get(KEYS.galeri, D.galeri),
    agenda: get(KEYS.agenda, D.agenda),
  });
  const go = (id) => { setPage(id); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const routes = {
    beranda: <BerandaPage p={p} go={go} />,
    profil: <ProfilLanding go={go} />,
    sambutan: <SambutanPage data={p.sambutan} />,
    sejarah: <SejarahPage data={p.sejarah} />,
    "visi-misi": <VisiMisiPage data={p.visimisi} />,
    struktur: <StrukturPage data={p.struktur} />,
    guru: <GuruPage data={p.guru} />,
    akademik: <AkademikLanding go={go} />,
    kurikulum: <KurikulumPage data={p.kurikulum} />,
    kalender: <KalenderPage data={p.kalender} />,
    jadwal: <JadwalPage data={p.jadwal} />,
    kesiswaan: <KesiswaanLanding go={go} />,
    ekskul: <EkskulPage data={p.ekskul} />,
    osis: <OsisPage data={p.osis} />,
    prestasi: <PrestasiPage data={p.prestasi} />,
    tatib: <TatibPage data={p.tatib} />,
    fasilitas: <FasilitasPage data={p.fasilitas} />,
    informasi: <InformasiLanding go={go} />,
    berita: <BeritaPage data={p.berita} />,
    pengumuman: <PengumumanPage data={p.pengumuman} />,
    agenda: <AgendaPage data={p.agenda} />,
    download: <DownloadPage data={p.download} />,
    ppdb: <PpdbPage data={p.ppdb} />,
    galeri: <GaleriPage data={p.galeri} />,
    kontak: <KontakPage p={p} />,
    admin: adminIn ? <AdminPanel p={p} setP={setP} adminIn={adminIn} setAdminIn={setAdminIn} /> : <AdminLogin onLogin={() => setAdminIn(true)} />,
  };
  return (
    <div className="min-h-screen bg-white text-slate-800">
      <TopBar p={p} />
      <Navbar page={page} setPage={go} adminIn={adminIn} setAdminIn={setAdminIn} />
      <main>{routes[page] || <BerandaPage p={p} go={go} />}</main>
      <Footer p={p} go={go} />
      <button onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })} className="fixed bottom-6 right-6 z-50 flex h-12 w-12 items-center justify-center rounded-full bg-yellow-500 text-navy-950 shadow-2xl transition hover:-translate-y-1"><I.ArrowUp c="h-5 w-5" /></button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
