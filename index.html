<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SMP Negeri 2 Muara Bungo — Sekolah Unggulan Kabupaten Bungo</title>
<meta name="description" content="Website resmi SMP Negeri 2 Muara Bungo. Mewujudkan generasi cerdas, berakhlak mulia, dan berprestasi."/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
:root {
  --navy: #0b1a3e;
  --navy-mid: #152454;
  --navy-light: #1e3270;
  --gold: #c8972a;
  --gold-light: #e8b84b;
  --gold-pale: #f5e4bc;
  --cream: #faf8f3;
  --cream-dark: #f0ebe0;
  --white: #ffffff;
  --text: #1a1a2e;
  --text-mid: #3d3d5c;
  --text-light: #6b6b8a;
  --border: #e2ddd5;
  --shadow-sm: 0 2px 12px rgba(11,26,62,0.08);
  --shadow-md: 0 8px 32px rgba(11,26,62,0.12);
  --shadow-lg: 0 20px 60px rgba(11,26,62,0.18);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.ff-serif{font-family:'Playfair Display',serif;}
.ff-dm-serif{font-family:'DM Serif Display',serif;}


/* INLINE EDIT */
.editable-field{display:inline;}
.clickable-edit{cursor:text !important;border-bottom:1px dashed rgba(200,151,42,0.5);border-radius:3px;padding:0 2px;transition:background .15s;}
.clickable-edit:hover{background:rgba(200,151,42,0.09);}
.edit-inline-input{font:inherit;color:inherit;background:rgba(200,151,42,0.09);border:none;border-bottom:2px solid var(--gold);border-radius:0;padding:1px 4px;outline:none;min-width:40px;}
.edit-inline-textarea{font:inherit;color:inherit;background:rgba(200,151,42,0.08);border:2px solid var(--gold);border-radius:6px;padding:4px 8px;outline:none;resize:both;min-width:120px;min-height:40px;display:block;}
.edit-toast{position:fixed;bottom:80px;right:28px;background:var(--navy);color:var(--white);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;}
.edit-toast.show{opacity:1;transform:translateY(0);}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--cream);}
::-webkit-scrollbar-thumb{background:var(--navy-light);border-radius:3px;}

/* TOPBAR */
#topbar{background:var(--navy);color:rgba(255,255,255,0.85);font-size:12px;padding:8px 0;position:relative;z-index:100;}
#topbar .inner{max-width:1280px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
#topbar .left{display:flex;align-items:center;gap:20px;}
#topbar .right{display:flex;align-items:center;gap:10px;}
.tb-item{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tb-item svg{width:12px;height:12px;opacity:.7;flex-shrink:0;}
.social-link{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);transition:all .2s;text-decoration:none;}
.social-link:hover{background:var(--gold);border-color:var(--gold);color:var(--navy);}
.social-link svg{width:12px;height:12px;}
.ann-badge{background:var(--gold);color:var(--navy);font-weight:700;font-size:11px;padding:3px 10px;border-radius:20px;white-space:nowrap;}

/* NAVBAR */
#navbar{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:99;transition:box-shadow .3s;}
#navbar.scrolled{box-shadow:var(--shadow-md);}
#navbar .inner{max-width:1280px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:72px;}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;cursor:pointer;}
.brand-name{line-height:1.2;}
.brand-name .t1{font-family:'DM Serif Display',serif;font-size:17px;color:var(--navy);display:block;}
.brand-name .t2{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--text-light);display:block;margin-top:1px;}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-item{position:relative;}
.nav-btn{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text-mid);background:none;border:none;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit;}
.nav-btn:hover,.nav-btn.active{color:var(--navy);background:var(--cream);}
.nav-btn.active{font-weight:600;}
.nav-btn svg{width:13px;height:13px;transition:transform .2s;}
.nav-item.open .nav-btn svg{transform:rotate(180deg);}
.dropdown{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(-8px);min-width:220px;background:var(--white);border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transition:opacity .35s ease, transform .35s ease, visibility .35s;pointer-events:none;z-index:200;}
.nav-item.open .dropdown{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);pointer-events:all;}
.drop-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;font-weight:500;color:var(--text-mid);cursor:pointer;transition:all .15s;border-radius:0;}
.drop-item:first-child{border-radius:14px 14px 0 0;}
.drop-item:last-child{border-radius:0 0 14px 14px;}
.drop-item:hover{background:var(--cream);color:var(--navy);}
.drop-item svg{width:15px;height:15px;color:var(--gold);flex-shrink:0;}
.drop-sep{height:1px;background:var(--border);margin:4px 0;}
.nav-ppdb{background:var(--gold);color:var(--navy)!important;font-weight:700!important;border-radius:8px;}
.nav-ppdb:hover{background:var(--gold-light)!important;color:var(--navy)!important;}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;background:none;border:none;}
.hamburger span{display:block;width:22px;height:2px;background:var(--navy);border-radius:2px;transition:all .25s;}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.mobile-menu{display:none;background:var(--white);border-top:1px solid var(--border);overflow-y:auto;max-height:80vh;}
.mob-item{padding:12px 24px;font-size:14px;font-weight:500;color:var(--text-mid);border-bottom:1px solid var(--cream);cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
.mob-item:hover{background:var(--cream);}
.mob-sub{background:var(--cream);padding:4px 0;}
.mob-sub-item{padding:10px 24px 10px 44px;font-size:13px;color:var(--text-mid);cursor:pointer;display:block;}
.mob-sub-item:hover{color:var(--navy);font-weight:500;}

/* HERO */
#hero{position:relative;background:var(--navy);min-height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0b1a3e 0%,#152454 40%,#0d2060 100%);}
.hero-pattern{position:absolute;inset:0;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
.hero-glow-1{position:absolute;top:-20%;right:-10%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(200,151,42,.15) 0%,transparent 70%);}
.hero-glow-2{position:absolute;bottom:-10%;left:-5%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(30,50,112,.6) 0%,transparent 70%);}
.hero-content{position:relative;z-index:2;flex:1;display:flex;align-items:center;max-width:1280px;margin:0 auto;padding:80px 28px 60px;width:100%;}
.hero-text{max-width:700px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(200,151,42,.15);border:1px solid rgba(200,151,42,.3);color:var(--gold-light);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:7px 16px;border-radius:50px;margin-bottom:28px;}
.hero-badge svg{width:13px;height:13px;}
.hero-h1{font-family:'Playfair Display',serif;font-size:clamp(42px,6vw,78px);font-weight:900;line-height:1.05;color:var(--white);margin-bottom:12px;}
.hero-h1 em{font-style:italic;color:var(--gold-light);}
.hero-sub{font-size:clamp(14px,2vw,18px);color:rgba(255,255,255,.65);line-height:1.7;margin-bottom:40px;max-width:560px;font-weight:300;}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:56px;}
.btn-gold{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--navy);font-weight:700;font-size:14px;padding:14px 28px;border-radius:10px;border:none;cursor:pointer;transition:all .2s;text-decoration:none;font-family:inherit;}
.btn-gold:hover{background:var(--gold-light);transform:translateY(-2px);box-shadow:0 8px 24px rgba(200,151,42,.4);}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.9);font-weight:600;font-size:14px;padding:14px 28px;border-radius:10px;border:1px solid rgba(255,255,255,.15);cursor:pointer;transition:all .2s;font-family:inherit;}
.btn-ghost:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);}
.hero-stats{display:flex;gap:40px;flex-wrap:wrap;}
.stat-item{text-align:left;}
.stat-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:900;color:var(--gold-light);line-height:1;}
.stat-label{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px;font-weight:400;}
.hero-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(200,151,42,.3),transparent);margin-top:40px;}

/* MARQUEE */
.marquee-bar{background:var(--gold);padding:10px 0;overflow:hidden;white-space:nowrap;}
.marquee-track{display:inline-flex;animation:marquee 25s linear infinite;}
.marquee-item{display:inline-flex;align-items:center;gap:10px;padding:0 30px;font-size:13px;font-weight:600;color:var(--navy);}
.marquee-dot{width:5px;height:5px;border-radius:50%;background:var(--navy);opacity:.4;}
@keyframes marquee{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}

/* SECTIONS */
.section{padding:90px 0;}
.section-inner{max-width:1280px;margin:0 auto;padding:0 28px;}
.section-tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;}
.section-tag::before{content:'';display:block;width:20px;height:2px;background:var(--gold);}
.section-h2{font-family:'Playfair Display',serif;font-size:clamp(30px,4vw,48px);font-weight:900;color:var(--navy);line-height:1.1;margin-bottom:16px;}
.section-h2 em{font-style:italic;color:var(--gold);}
.section-desc{font-size:15px;color:var(--text-light);max-width:560px;line-height:1.75;}

/* ABOUT STRIP */
#about-strip{background:var(--cream);}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;}
.about-img-wrap{position:relative;}
.about-img-block{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);border-radius:20px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.about-img-block svg{width:120px;height:120px;color:rgba(255,255,255,.15);}
.about-badge-float{position:absolute;bottom:-20px;right:-20px;background:var(--gold);color:var(--navy);border-radius:14px;padding:16px 20px;text-align:center;box-shadow:var(--shadow-md);}
.about-badge-float .num{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;line-height:1;}
.about-badge-float .lbl{font-size:11px;font-weight:600;opacity:.8;margin-top:2px;}
.about-facts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px;}
.fact-card{background:var(--white);border-radius:12px;padding:16px;border:1px solid var(--border);}
.fact-card .icon{width:36px;height:36px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.fact-card .icon svg{width:18px;height:18px;color:var(--gold);}
.fact-card .num{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:var(--navy);}
.fact-card .lbl{font-size:12px;color:var(--text-light);margin-top:2px;}

/* MENU CARDS */
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.menu-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:24px;cursor:pointer;transition:all .22s;text-align:left;position:relative;overflow:hidden;}
.menu-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy-light));opacity:0;transition:opacity .22s;border-radius:16px;}
.menu-card:hover::after{opacity:1;}
.menu-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.menu-card .mc-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;position:relative;z-index:1;transition:background .22s;}
.menu-card .mc-icon svg{width:24px;height:24px;transition:color .22s;}
.menu-card .mc-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px;position:relative;z-index:1;transition:color .22s;}
.menu-card .mc-desc{font-size:12.5px;color:var(--text-light);line-height:1.5;position:relative;z-index:1;transition:color .22s;}
.menu-card .mc-arrow{display:inline-flex;align-items:center;gap:5px;margin-top:14px;font-size:12px;font-weight:700;color:var(--gold);position:relative;z-index:1;transition:color .22s;}
.menu-card .mc-arrow svg{width:14px;height:14px;}
.menu-card:hover .mc-title,.menu-card:hover .mc-desc{color:rgba(255,255,255,.85);}
.menu-card:hover .mc-title{color:var(--white);}
.menu-card:hover .mc-arrow{color:var(--gold-light);}

/* NEWS */
.news-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;}
.news-card{background:var(--white);border-radius:16px;overflow:hidden;border:1px solid var(--border);transition:all .22s;cursor:pointer;}
.news-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);}
.news-thumb{height:180px;background:linear-gradient(135deg,var(--navy),var(--navy-light));display:flex;align-items:center;justify-content:center;position:relative;}
.news-thumb svg{width:52px;height:52px;color:rgba(255,255,255,.2);}
.news-cat{position:absolute;top:12px;left:12px;background:var(--gold);color:var(--navy);font-size:10px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:20px;}
.news-body{padding:20px;}
.news-date{font-size:11px;color:var(--text-light);margin-bottom:8px;}
.news-title{font-family:'DM Serif Display',serif;font-size:16px;color:var(--navy);line-height:1.35;margin-bottom:8px;}
.news-excerpt{font-size:13px;color:var(--text-light);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* PRESTASI */
#prestasi-sec{background:var(--navy);}
.prestasi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.prestasi-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px;transition:all .2s;}
.prestasi-card:hover{background:rgba(255,255,255,.09);border-color:rgba(200,151,42,.3);}
.prestasi-medal{font-size:32px;margin-bottom:12px;}
.prestasi-year{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
.prestasi-title{font-family:'DM Serif Display',serif;font-size:16px;color:var(--white);line-height:1.3;margin-bottom:6px;}
.prestasi-lembaga{font-size:12px;color:rgba(255,255,255,.45);}

/* PENGUMUMAN */
.peng-list{display:flex;flex-direction:column;gap:14px;}
.peng-item{display:flex;align-items:flex-start;gap:16px;background:var(--white);border-radius:14px;padding:18px;border:1px solid var(--border);cursor:pointer;transition:all .2s;}
.peng-item:hover{border-color:var(--gold);box-shadow:var(--shadow-sm);}
.peng-dot{width:10px;height:10px;border-radius:50%;background:var(--text-light);flex-shrink:0;margin-top:5px;}
.peng-dot.penting{background:var(--gold);}
.peng-info{}
.peng-title{font-size:14.5px;font-weight:600;color:var(--navy);margin-bottom:4px;}
.peng-date{font-size:12px;color:var(--text-light);}
.peng-badge{background:rgba(200,151,42,.12);color:var(--gold);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px;}

/* AGENDA */
.agenda-list{display:flex;flex-direction:column;gap:12px;}
.agenda-item{display:flex;gap:16px;padding:16px;background:var(--cream);border-radius:12px;border:1px solid var(--border);}
.agenda-date{text-align:center;min-width:52px;background:var(--navy);color:var(--white);border-radius:10px;padding:10px 8px;}
.agenda-date .day{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;line-height:1;}
.agenda-date .mon{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:2px;}
.agenda-info{}
.agenda-title{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:4px;}
.agenda-desc{font-size:12.5px;color:var(--text-light);}

/* FASILITAS */
.fas-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.fas-card{background:var(--cream);border-radius:14px;padding:22px;text-align:center;border:1px solid var(--border);transition:all .2s;}
.fas-card:hover{background:var(--white);box-shadow:var(--shadow-md);transform:translateY(-3px);}
.fas-icon{font-size:32px;margin-bottom:12px;}
.fas-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:6px;}
.fas-desc{font-size:12px;color:var(--text-light);line-height:1.5;}

/* KEUNGGULAN */
.keung-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.keung-card{padding:28px;background:var(--cream);border-radius:16px;border:1px solid var(--border);}
.keung-icon{font-size:28px;margin-bottom:14px;}
.keung-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.keung-desc{font-size:13px;color:var(--text-light);line-height:1.65;}

/* VISI MISI */
.visimisi-hero{background:linear-gradient(135deg,var(--navy),var(--navy-light));border-radius:20px;padding:48px;color:var(--white);}
.visi-text{font-family:'Playfair Display',serif;font-size:clamp(16px,2vw,22px);font-style:italic;line-height:1.6;color:rgba(255,255,255,.9);}
.misi-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:32px;}
.misi-item{display:flex;gap:14px;background:var(--cream);border-radius:12px;padding:16px;}
.misi-num{width:32px;height:32px;border-radius:8px;background:var(--navy);color:var(--gold);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.misi-txt{font-size:13.5px;color:var(--text-mid);line-height:1.6;}
.motto-banner{background:var(--gold);border-radius:16px;padding:32px;text-align:center;margin-top:32px;}
.motto-text{font-family:'Playfair Display',serif;font-size:clamp(22px,3vw,36px);font-weight:900;color:var(--navy);font-style:italic;}

/* STRUKTUR */
.org-tree{display:flex;flex-direction:column;align-items:center;gap:0;}
.org-top{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:var(--white);border-radius:16px;padding:20px 40px;text-align:center;min-width:280px;}
.org-top .otname{font-family:'DM Serif Display',serif;font-size:18px;}
.org-top .otjab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-top:4px;}
.org-connector{width:2px;height:32px;background:var(--border);}
.org-mid{display:flex;gap:20px;align-items:flex-start;}
.org-branch{display:flex;flex-direction:column;align-items:center;gap:0;}
.org-card{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:14px 20px;text-align:center;min-width:180px;}
.org-card .ocname{font-size:13px;font-weight:700;color:var(--navy);}
.org-card .ocjab{font-size:10px;color:var(--text-light);margin-top:3px;}
.org-sub-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:32px;}
.org-sub-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center;}

/* GURU */
.guru-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.guru-card{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:all .2s;text-align:center;}
.guru-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);}
.guru-img{height:140px;background:linear-gradient(135deg,var(--navy),var(--navy-light));display:flex;align-items:center;justify-content:center;position:relative;}
.guru-initial{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:26px;font-weight:900;color:var(--gold);}
.guru-body{padding:16px;}
.guru-name{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.guru-jabatan{font-size:11.5px;color:var(--gold);font-weight:600;}

/* KURIKULUM */
.kuri-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.kuri-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:22px;transition:all .2s;}
.kuri-card:hover{border-color:var(--gold);box-shadow:var(--shadow-sm);}
.kuri-num{width:36px;height:36px;border-radius:9px;background:var(--navy);color:var(--gold);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:14px;}
.kuri-title{font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.kuri-desc{font-size:13px;color:var(--text-light);line-height:1.6;}

/* KALENDER */
.kal-table{width:100%;border-collapse:collapse;background:var(--white);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
.kal-table thead tr{background:var(--navy);color:var(--white);}
.kal-table th{padding:14px 20px;text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;}
.kal-table td{padding:14px 20px;border-bottom:1px solid var(--border);font-size:14px;}
.kal-table tr:last-child td{border-bottom:none;}
.kal-table tr:nth-child(even) td{background:var(--cream);}
.kal-td-judul{color:var(--navy);font-weight:500;}
.kal-td-tgl{color:var(--text-light);}

/* JADWAL */
.jadwal-box{background:var(--cream);border-radius:16px;padding:28px;border:1px solid var(--border);}
.jadwal-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--navy);margin-bottom:20px;}
.jadwal-list{display:flex;flex-direction:column;gap:10px;}
.jadwal-row{display:flex;align-items:center;gap:16px;background:var(--white);padding:12px 16px;border-radius:10px;}
.jadwal-day{font-size:12px;font-weight:700;color:var(--navy);min-width:70px;}
.jadwal-mapel{font-size:13px;color:var(--text-mid);}
.jadwal-jam{font-size:11px;color:var(--text-light);margin-left:auto;display:flex;align-items:center;gap:4px;}
.jadwal-jam svg{width:12px;height:12px;}

/* EKSKUL */
.ekskul-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.ekskul-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:22px;transition:all .2s;cursor:pointer;}
.ekskul-card:hover{box-shadow:var(--shadow-md);border-color:var(--gold);}
.eks-icon-wrap{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px;}
.eks-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px;}
.eks-desc{font-size:12.5px;color:var(--text-light);line-height:1.55;}
.eks-schedule{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--gold);font-weight:600;margin-top:12px;}
.eks-schedule svg{width:12px;height:12px;}

/* OSIS */
.osis-hero{background:linear-gradient(135deg,var(--navy),var(--navy-light));border-radius:20px;padding:40px;color:var(--white);display:grid;grid-template-columns:1fr 1fr;gap:40px;}
.osis-org-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
.osis-org-item{background:rgba(255,255,255,.08);border-radius:10px;padding:14px;}
.osis-org-jabatan{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
.osis-org-nama{font-size:14px;font-weight:600;}

/* PPDB */
.ppdb-hero{background:linear-gradient(135deg,var(--gold),#a36e1a);border-radius:20px;padding:48px;color:var(--navy);}
.ppdb-stats{display:flex;gap:40px;flex-wrap:wrap;margin-top:28px;}
.ppdb-stat{text-align:center;}
.ppdb-stat .num{font-family:'Playfair Display',serif;font-size:40px;font-weight:900;line-height:1;}
.ppdb-stat .lbl{font-size:12px;font-weight:600;opacity:.7;margin-top:4px;}
.ppdb-alur{display:flex;flex-direction:column;gap:0;}
.ppdb-step{display:flex;gap:20px;position:relative;padding-bottom:32px;}
.ppdb-step:last-child{padding-bottom:0;}
.ppdb-step-num{width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--gold);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;position:relative;z-index:1;}
.ppdb-step::before{content:'';position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--border);}
.ppdb-step:last-child::before{display:none;}
.ppdb-step-info{}
.ppdb-step-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.ppdb-step-desc{font-size:13px;color:var(--text-light);}
.ppdb-syarat-list{display:flex;flex-direction:column;gap:8px;}
.ppdb-syarat-item{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-mid);}
.ppdb-syarat-item::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;}
.jalur-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;}
.jalur-item{background:var(--cream);border-radius:10px;padding:14px;border:1px solid var(--border);}
.jalur-pct{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--navy);}
.jalur-name{font-size:12px;color:var(--text-light);margin-top:4px;}

/* TATIB */
.tatib-list{display:flex;flex-direction:column;gap:20px;}
.tatib-item{}
.tatib-judul{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--gold);display:inline-block;}
.tatib-rules{display:flex;flex-direction:column;gap:6px;}
.tatib-rule{font-size:13.5px;color:var(--text-mid);line-height:1.6;padding-left:18px;position:relative;}
.tatib-rule::before{content:'•';position:absolute;left:0;color:var(--gold);}

/* GALERI */
.galeri-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.galeri-item{border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(135deg,var(--navy),var(--navy-light));cursor:pointer;transition:all .2s;position:relative;display:flex;align-items:center;justify-content:center;}
.galeri-item:hover{transform:scale(1.02);box-shadow:var(--shadow-md);}
.galeri-item:nth-child(1){grid-column:span 2;grid-row:span 2;aspect-ratio:auto;}
.galeri-item svg{width:40px;height:40px;color:rgba(255,255,255,.2);}
.galeri-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,26,62,.9) 0%,transparent 60%);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;padding:16px;}
.galeri-item:hover .galeri-overlay{opacity:1;}
.galeri-caption{color:var(--white);font-size:13px;font-weight:600;}
.galeri-tipe{font-size:10px;color:var(--gold);margin-bottom:4px;}

/* KONTAK */
.kontak-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start;}
.kontak-info-list{display:flex;flex-direction:column;gap:20px;}
.kontak-info-item{display:flex;gap:16px;}
.kontak-info-icon{width:44px;height:44px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kontak-info-icon svg{width:20px;height:20px;color:var(--gold);}
.kontak-info-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-light);margin-bottom:4px;}
.kontak-info-val{font-size:14.5px;font-weight:500;color:var(--navy);}
.map-frame{border-radius:16px;overflow:hidden;border:1px solid var(--border);height:320px;background:var(--cream);display:flex;align-items:center;justify-content:center;margin-top:24px;}
.sosmed-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;}
.sosmed-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;background:var(--cream);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--navy);text-decoration:none;transition:all .2s;}
.sosmed-btn:hover{background:var(--navy);color:var(--white);}
.sosmed-btn svg{width:16px;height:16px;}

/* FORM */
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-light);margin-bottom:8px;}
.form-input{width:100%;padding:12px 16px;background:var(--cream);border:1px solid var(--border);border-radius:10px;font-size:14px;color:var(--text);font-family:inherit;transition:border-color .2s;outline:none;}
.form-input:focus{border-color:var(--gold);background:var(--white);}
.form-textarea{resize:vertical;min-height:120px;}

/* DOWNLOAD */
.dl-grid{display:flex;flex-direction:column;gap:12px;}
.dl-item{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--cream);border-radius:12px;border:1px solid var(--border);transition:all .2s;cursor:pointer;}
.dl-item:hover{border-color:var(--gold);background:var(--white);box-shadow:var(--shadow-sm);}
.dl-icon{width:42px;height:42px;background:rgba(200,151,42,.12);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dl-icon svg{width:20px;height:20px;color:var(--gold);}
.dl-info{flex:1;}
.dl-name{font-size:14px;font-weight:600;color:var(--navy);}
.dl-size{font-size:12px;color:var(--text-light);margin-top:2px;}
.dl-btn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--gold);background:none;border:none;cursor:pointer;font-family:inherit;}
.dl-btn svg{width:15px;height:15px;}

/* PAGE HEADER */
.page-header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);padding:70px 0 60px;position:relative;overflow:hidden;}
.page-header::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M20 20.5V18H0v5h5v5H0v5h20v-9.5zm-2 9.5H2V21h16v9zM20 18H10v-5h5v-5h5V2h-5V0H0v10h5v5H0v5h20V18zm-2-2H2V2h16v14z'/%3E%3C/g%3E%3C/svg%3E");opacity:1;}
.page-header-inner{max-width:1280px;margin:0 auto;padding:0 28px;position:relative;}
.ph-breadcrumb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:16px;}
.ph-breadcrumb svg{width:12px;height:12px;}
.ph-title{font-family:'Playfair Display',serif;font-size:clamp(32px,5vw,56px);font-weight:900;color:var(--white);line-height:1.05;margin-bottom:12px;}
.ph-title em{font-style:italic;color:var(--gold-light);}
.ph-line{width:48px;height:3px;background:var(--gold);border-radius:2px;margin-bottom:14px;}
.ph-sub{font-size:15px;color:rgba(255,255,255,.6);max-width:540px;line-height:1.65;font-weight:300;}

/* SAMB */
.samb-wrap{max-width:840px;margin:0 auto;}
.samb-header{display:flex;gap:32px;align-items:flex-start;padding:36px;background:var(--cream);border-radius:20px;margin-bottom:36px;}
.samb-photo{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy-light));flex-shrink:0;display:flex;align-items:center;justify-content:center;border:3px solid var(--gold);}
.samb-photo svg{width:48px;height:48px;color:rgba(255,255,255,.4);}
.samb-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--navy);}
.samb-jabatan{font-size:13px;color:var(--text-light);margin-top:4px;}
.samb-ucapan{font-style:italic;font-size:15px;color:var(--gold);font-weight:500;margin-top:12px;line-height:1.6;}
.samb-content{font-size:15px;color:var(--text-mid);line-height:1.85;}
.samb-content p{margin-bottom:20px;}

/* SEJARAH */
.timeline{position:relative;padding-left:40px;}
.timeline::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--border);}
.tl-item{position:relative;margin-bottom:36px;}
.tl-dot{position:absolute;left:-40px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--navy);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;}
.tl-dot-inner{width:6px;height:6px;border-radius:50%;background:var(--gold);}
.tl-year{font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
.tl-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--navy);margin-bottom:8px;}
.tl-desc{font-size:14px;color:var(--text-light);line-height:1.65;}

/* BERITA */
.berita-full .news-grid{grid-template-columns:1fr 1fr;}
.berita-detail{max-width:800px;margin:0 auto;}
.berita-detail-header{margin-bottom:32px;}
.berita-detail-cat{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.berita-detail-title{font-family:'Playfair Display',serif;font-size:clamp(24px,3vw,40px);font-weight:900;color:var(--navy);line-height:1.15;margin-bottom:16px;}
.berita-detail-meta{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--text-light);}
.berita-detail-img{height:340px;background:linear-gradient(135deg,var(--navy),var(--navy-light));border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:32px;}
.berita-detail-img svg{width:60px;height:60px;color:rgba(255,255,255,.2);}
.berita-detail-body p{font-size:15px;color:var(--text-mid);line-height:1.85;margin-bottom:20px;}

/* PENGUMUMAN PAGE */
.peng-full{display:flex;flex-direction:column;gap:16px;}
.peng-full-item{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:24px;cursor:pointer;transition:all .2s;}
.peng-full-item.penting{border-left:4px solid var(--gold);}
.peng-full-item:hover{box-shadow:var(--shadow-md);}
.peng-full-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.peng-full-title{font-size:16px;font-weight:700;color:var(--navy);}
.peng-full-date{font-size:12px;color:var(--text-light);white-space:nowrap;}
.peng-full-body{font-size:14px;color:var(--text-light);line-height:1.65;}

/* AGENDA PAGE */
.agenda-full{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

/* ADMIN */
.admin-wrap{max-width:960px;margin:0 auto;}
.admin-login{max-width:440px;margin:80px auto;background:var(--white);border:1px solid var(--border);border-radius:20px;padding:48px;box-shadow:var(--shadow-lg);}
.admin-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;}
.admin-tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:var(--cream);border:1px solid var(--border);color:var(--text-mid);transition:all .15s;font-family:inherit;}
.admin-tab.active{background:var(--navy);color:var(--white);border-color:var(--navy);}
.admin-section{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:32px;}
.admin-section h3{font-family:'DM Serif Display',serif;font-size:22px;color:var(--navy);margin-bottom:24px;}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.admin-item-list{display:flex;flex-direction:column;gap:10px;}
.admin-item-row{display:flex;gap:10px;align-items:flex-start;background:var(--cream);border-radius:10px;padding:12px;}
.admin-item-row input,.admin-item-row textarea{flex:1;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none;transition:border-color .2s;}
.admin-item-row input:focus,.admin-item-row textarea:focus{border-color:var(--gold);}
.admin-del-btn{background:none;border:none;cursor:pointer;color:#dc2626;padding:8px;border-radius:8px;transition:background .15s;flex-shrink:0;}
.admin-del-btn:hover{background:rgba(220,38,38,.08);}
.admin-del-btn svg{width:16px;height:16px;}
.admin-add-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--gold);background:none;border:2px dashed var(--gold);border-radius:10px;padding:10px 16px;cursor:pointer;width:100%;justify-content:center;transition:all .15s;margin-top:8px;font-family:inherit;}
.admin-add-btn:hover{background:rgba(200,151,42,.06);}
.save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--navy);padding:16px 28px;display:flex;align-items:center;justify-content:between;z-index:200;gap:16px;}
.save-bar .inner{max-width:1280px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;}
.save-bar .txt{color:rgba(255,255,255,.8);font-size:14px;}
.save-bar .txt strong{color:var(--gold);}

/* FOOTER */
footer{background:var(--navy);color:rgba(255,255,255,.75);padding:60px 0 0;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px;padding-bottom:48px;}
.footer-brand{margin-bottom:20px;}
.footer-brand .t1{font-family:'DM Serif Display',serif;font-size:18px;color:var(--white);margin-bottom:4px;}
.footer-brand .t2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);}
.footer-desc{font-size:13px;line-height:1.75;color:rgba(255,255,255,.5);margin-bottom:20px;}
.footer-sosmed{display:flex;gap:8px;}
.footer-sosmed a{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);text-decoration:none;transition:all .2s;}
.footer-sosmed a:hover{background:var(--gold);color:var(--navy);}
.footer-sosmed a svg{width:15px;height:15px;}
.footer-col-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;}
.footer-links{display:flex;flex-direction:column;gap:9px;}
.footer-link{font-size:13.5px;color:rgba(255,255,255,.55);cursor:pointer;transition:color .15s;background:none;border:none;text-align:left;font-family:inherit;padding:0;}
.footer-link:hover{color:var(--gold-light);}
.footer-contact-item{display:flex;gap:10px;margin-bottom:12px;font-size:13px;color:rgba(255,255,255,.55);align-items:flex-start;}
.footer-contact-item svg{width:14px;height:14px;flex-shrink:0;margin-top:2px;color:var(--gold);opacity:.8;}
.footer-bottom{border-top:1px solid rgba(255,255,255,.07);padding:20px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.3);}

/* BACK BTN */
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-light);cursor:pointer;background:none;border:none;font-family:inherit;margin-bottom:28px;padding:0;transition:color .15s;}
.back-btn:hover{color:var(--navy);}
.back-btn svg{width:16px;height:16px;}

/* SCROLL TO TOP */
#scroll-top{position:fixed;bottom:28px;right:28px;z-index:100;width:44px;height:44px;border-radius:12px;background:var(--navy);color:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-md);transition:all .2s;border:none;opacity:0;pointer-events:none;}
#scroll-top.visible{opacity:1;pointer-events:all;}
#scroll-top:hover{background:var(--gold);color:var(--navy);transform:translateY(-2px);}
#scroll-top svg{width:18px;height:18px;}

/* DIVIDERS */
